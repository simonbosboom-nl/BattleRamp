name: Deploy Battle Ramps Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          cat site-bundle/stadium-*.b64 | tr -d '\n' | base64 --decode > _site/assets/battle-ramps-stadium.webp
          test -s _site/index.html
          test -s _site/assets/battle-ramps-stadium.webp
          grep -q 'BATTLE RAMPS' _site/index.html
          grep -q 'id="splashStart"' _site/index.html
          grep -q 'Kies je auto' _site/index.html
          grep -q 'START MET' _site/index.html
          grep -q 'battle-ramps-stadium.webp' _site/index.html
          file _site/assets/battle-ramps-stadium.webp
          echo "Built HTML ($(wc -c < _site/index.html) bytes) and stadium asset ($(wc -c < _site/assets/battle-ramps-stadium.webp) bytes)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
