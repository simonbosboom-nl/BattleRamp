name: Deploy Battle Ramps Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble the site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          base64 --decode < site-bundle/stadium-clean.b64 > _site/assets/battle-ramps-stadium.webp
          test -s _site/index.html
          test -s _site/assets/battle-ramps-stadium.webp
          test "$(stat -c %s _site/assets/battle-ramps-stadium.webp)" -gt 6000
          grep -q 'v=clean-20261010a' _site/index.html
          grep -q 'BATTLE RAMPS' _site/index.html
          grep -q 'id="splashStart"' _site/index.html
          grep -q 'Kies je auto' _site/index.html
          grep -q 'START MET' _site/index.html
          grep -q 'battle-ramps-stadium.webp' _site/index.html
          file _site/assets/battle-ramps-stadium.webp
          echo "Built HTML ($(wc -c < _site/index.html) bytes) and stadium asset ($(wc -c < _site/assets/battle-ramps-stadium.webp) bytes)"
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke test 3D startup and arena rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory _site >/tmp/battleramps-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node .github/scripts/webgl-smoke.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
